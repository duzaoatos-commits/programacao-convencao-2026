<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programação · Convenção de Polos 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --deep: #001E45; --navy: #00306D; --royal: #0058A0; --cyan: #0092CB; --light: #5CC8F0; --white: #F4F8FC;
    --muted: rgba(244, 248, 252, 0.62); --lilas: #EBDDFF;
    --glass: rgba(255, 255, 255, 0.07); --glass-line: rgba(255, 255, 255, 0.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--deep); overflow: hidden; cursor: none; }
  body { font-family: 'Montserrat', system-ui, sans-serif; color: var(--white); -webkit-font-smoothing: antialiased; }

  #stage, #intro, .cobre { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #stage { z-index: 1; transition: opacity .6s ease; }
  body.vinheta-on #stage, body.intro-on #stage { opacity: 0; }
  #intro { z-index: 2; pointer-events: none; }
  .camada { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  #fundo { z-index: 0; background: #07051c; }
  #camada-grao { z-index: 5; }
  #camada-vinheta { z-index: 10; }

  /* ---------- aurora ---------- */
  .aurora { position: absolute; inset: 0; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; will-change: transform; }
  .b1 { width: 1700px; height: 1300px; left: -260px; top: -520px; background: radial-gradient(closest-side, rgba(110, 72, 235, 0.95), rgba(110, 72, 235, 0)); animation: d1 15s ease-in-out infinite alternate; }
  .b2 { width: 1200px; height: 1000px; right: -420px; top: -520px; background: radial-gradient(closest-side, rgba(196, 72, 220, 0.85), rgba(196, 72, 220, 0)); animation: d2 12s ease-in-out infinite alternate; }
  .b3 { width: 1500px; height: 1000px; left: 360px; bottom: -420px; background: radial-gradient(closest-side, rgba(56, 150, 255, 0.95), rgba(56, 150, 255, 0)); animation: d3 17s ease-in-out infinite alternate; }
  .b4 { width: 900px; height: 700px; left: 820px; top: 300px; background: radial-gradient(closest-side, rgba(110, 215, 255, 0.55), rgba(110, 215, 255, 0)); animation: d4 11s ease-in-out infinite alternate; }
  .b5 { width: 1300px; height: 1100px; left: -520px; bottom: -520px; background: radial-gradient(closest-side, rgba(58, 52, 190, 0.8), rgba(58, 52, 190, 0)); animation: d5 16s ease-in-out infinite alternate; }
  @keyframes d1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(380px, 240px) scale(1.18); } }
  @keyframes d2 { from { transform: translate(0, 0) scale(1.05); } to { transform: translate(-520px, 220px) scale(0.85); } }
  @keyframes d3 { from { transform: translate(0, 0); } to { transform: translate(-460px, -240px) scale(1.2); } }
  @keyframes d4 { from { transform: translate(0, 0) scale(0.9); } to { transform: translate(-560px, -200px) scale(1.3); } }
  @keyframes d5 { from { transform: translate(0, 0); } to { transform: translate(460px, -220px) scale(1.15); } }
  .vinheta-escura { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 80% at 50% 48%, rgba(7, 5, 28, 0) 45%, rgba(7, 5, 28, .85) 100%); }
  .poeira { position: absolute; left: 0; top: 0; width: 1px; height: 1px; border-radius: 50%; box-shadow: 663px 308px 0 1px rgba(255,255,255,0.18), 148px 192px 0 1px rgba(255,255,255,0.18), 1863px 1039px 0 1px rgba(255,255,255,0.18), 176px 888px 0 1px rgba(255,255,255,0.18), 492px 185px 0 2px rgba(255,255,255,0.45), 121px 253px 0 1px rgba(255,255,255,0.18), 1181px 812px 0 1px rgba(255,255,255,0.25), 95px 272px 0 1px rgba(255,255,255,0.45), 295px 241px 0 2px rgba(255,255,255,0.35), 1147px 370px 0 1px rgba(255,255,255,0.25), 762px 199px 0 2px rgba(255,255,255,0.18), 1155px 122px 0 2px rgba(255,255,255,0.25), 1016px 875px 0 1px rgba(255,255,255,0.45), 1199px 928px 0 1px rgba(255,255,255,0.35), 508px 368px 0 2px rgba(255,255,255,0.25), 167px 614px 0 2px rgba(255,255,255,0.45), 1792px 703px 0 2px rgba(255,255,255,0.45), 589px 149px 0 1px rgba(255,255,255,0.45), 337px 700px 0 1px rgba(255,255,255,0.45), 863px 80px 0 2px rgba(255,255,255,0.18), 1565px 642px 0 1px rgba(255,255,255,0.35), 1217px 1017px 0 2px rgba(255,255,255,0.45), 140px 191px 0 1px rgba(255,255,255,0.45), 1427px 133px 0 1px rgba(255,255,255,0.35), 1325px 912px 0 1px rgba(255,255,255,0.45), 1816px 710px 0 1px rgba(255,255,255,0.45), 727px 344px 0 2px rgba(255,255,255,0.18), 1011px 120px 0 1px rgba(255,255,255,0.35), 264px 507px 0 1px rgba(255,255,255,0.45), 1877px 1016px 0 1px rgba(255,255,255,0.25), 919px 822px 0 2px rgba(255,255,255,0.35), 1809px 280px 0 1px rgba(255,255,255,0.35), 1446px 850px 0 1px rgba(255,255,255,0.45), 472px 309px 0 1px rgba(255,255,255,0.25), 309px 475px 0 2px rgba(255,255,255,0.25), 24px 993px 0 2px rgba(255,255,255,0.25), 538px 577px 0 1px rgba(255,255,255,0.25), 858px 756px 0 2px rgba(255,255,255,0.35), 257px 1055px 0 2px rgba(255,255,255,0.18), 935px 803px 0 1px rgba(255,255,255,0.45), 807px 212px 0 1px rgba(255,255,255,0.45), 127px 390px 0 1px rgba(255,255,255,0.25), 902px 332px 0 1px rgba(255,255,255,0.35), 1230px 107px 0 1px rgba(255,255,255,0.18), 1160px 309px 0 2px rgba(255,255,255,0.18), 744px 52px 0 1px rgba(255,255,255,0.25); animation: poeira 60s ease-in-out infinite alternate; }
  @keyframes poeira { from { transform: translate(0, 0); } to { transform: translate(-40px, -70px); } }
  .stripes { position: absolute; top: 0; left: -640px; width: 2560px; height: 1080px; opacity: 0.9;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,.045) 0 10px, transparent 10px 21px, rgba(255,255,255,.045) 21px 31px, transparent 31px 42px, rgba(255,255,255,.045) 42px 52px, transparent 52px 63px, rgba(255,255,255,.045) 63px 73px, transparent 73px 452.55px);
    animation: listras 60s linear infinite; }
  @keyframes listras { from { transform: translateX(0); } to { transform: translateX(640px); } }
  .grain { position: absolute; inset: 0; opacity: 0.05; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* ---------- glass ---------- */
  .glass { position: relative; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 36px;
    backdrop-filter: blur(30px) saturate(140%); -webkit-backdrop-filter: blur(30px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.32), 0 40px 90px rgba(0, 8, 35, .45); }

  /* ---------- header ---------- */
  header { position: absolute; left: 96px; right: 96px; top: 56px; height: 120px; display: flex; align-items: center; justify-content: space-between; z-index: 3; }
  .marca { display: flex; align-items: center; gap: 40px; }
  .marca img { height: 112px; display: block; }
  .marca .sep { width: 1px; height: 72px; background: rgba(255,255,255,.3); }
  .marca .dia { font-weight: 300; font-size: 26px; letter-spacing: .32em; text-transform: uppercase; line-height: 1.5; }
  .marca .dia b { display: block; font-weight: 800; font-size: 34px; letter-spacing: .2em; }
  .relogio { text-align: right; }
  .direita { display: flex; align-items: center; gap: 44px; }
  .qr { display: flex; align-items: center; gap: 20px; padding-right: 44px; border-right: 1px solid rgba(255,255,255,.3); }
  .qr img { width: 112px; height: 112px; border-radius: 14px; display: block; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .qr-t { text-align: right; font-weight: 300; font-size: 17px; letter-spacing: .22em; text-transform: uppercase; line-height: 1.5; color: var(--muted); }
  .qr-t b { font-weight: 700; color: var(--white); letter-spacing: .18em; }
  .relogio .h { font-weight: 600; font-size: 76px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .relogio .d { margin-top: 10px; font-weight: 400; font-size: 20px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }

  /* ---------- telas ---------- */
  .tela { position: absolute; left: 96px; right: 96px; top: 224px; bottom: 96px; z-index: 2; }
  /* coreografia: cartões se desenham a partir de uma linha de luz, textos sobem por máscara */
  .tela .glass { clip-path: inset(50% 50% 50% 50% round 36px); }
  .tela .glass::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,0), #fff 50%, rgba(255,255,255,0)); box-shadow: 0 0 24px 4px rgba(190, 170, 255, .55); opacity: 0; }
  .tela.on .glass { animation: forma 1.05s var(--d, 0ms) both; }
  .tela.on .glass::before { animation: luz 1.05s var(--d, 0ms) both; }
  @keyframes forma {
    0% { clip-path: inset(calc(50% - 1px) 50% calc(50% - 1px) 50% round 36px); animation-timing-function: cubic-bezier(.7, 0, .2, 1); }
    42% { clip-path: inset(calc(50% - 1px) 0 calc(50% - 1px) 0 round 36px); animation-timing-function: cubic-bezier(.16, 1, .3, 1); }
    100% { clip-path: inset(-70px -70px -70px -70px round 106px); } }
  @keyframes luz { 0% { opacity: 1; transform: scaleX(0); } 42% { opacity: 1; transform: scaleX(1); } 70% { opacity: 0; transform: scaleX(1); } 100% { opacity: 0; } }

  .rv { overflow: hidden; padding-bottom: .14em; margin-bottom: -.14em; }
  .rv-i { display: block; transform: translateY(110%); }
  .t > .rv-i, .p > .rv-i { overflow: hidden; text-overflow: ellipsis; }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .1em; margin-bottom: -.1em; }
  .wi { display: inline-block; transform: translateY(110%) rotate(5deg); transform-origin: 0 100%; }
  .tela .pop { clip-path: inset(0 100% 0 0 round 999px); }
  .tela.on .rv-i, .tela.on .wi { animation: sobe .95s cubic-bezier(.16, 1, .3, 1) var(--d, 0ms) both; }
  .tela.on .pop { animation: abre .9s cubic-bezier(.16, 1, .3, 1) var(--d, 0ms) both; }
  @keyframes sobe { from { transform: translateY(110%) rotate(5deg); } to { transform: none; } }
  @keyframes abre { to { clip-path: inset(0 0 0 0 round 999px); } }

  /* saída: textos sobem e somem, depois os cartões se recolhem na linha */
  .tela.off .rv-i, .tela.off .wi { animation: sai .42s cubic-bezier(.7, 0, .84, 0) calc(var(--d, 0ms) * .12) both; }
  .tela.off .pop { animation: fecha-pop .4s cubic-bezier(.7, 0, .84, 0) both; }
  .tela.off .glass { animation: recolhe .55s cubic-bezier(.7, 0, .84, 0) calc(.28s + var(--d, 0ms) * .25) both; }
  @keyframes sai { from { transform: none; } to { transform: translateY(-110%); } }
  @keyframes fecha-pop { from { clip-path: inset(0 0 0 0 round 999px); } to { clip-path: inset(0 0 0 100% round 999px); } }
  @keyframes recolhe { 0% { clip-path: inset(-70px -70px -70px -70px round 106px); } 60% { clip-path: inset(calc(50% - 1px) 0 calc(50% - 1px) 0 round 36px); } 100% { clip-path: inset(calc(50% - 1px) 50% calc(50% - 1px) 50% round 36px); } }

  .rot { font-weight: 300; font-size: 24px; letter-spacing: .34em; text-transform: uppercase; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 14px; font-weight: 700; font-size: 24px; letter-spacing: .28em; text-transform: uppercase; padding: 12px 24px 12px 22px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); }
  .chip.vivo { background: rgba(0,146,203,.28); border-color: rgba(92,200,240,.6); }
  .ponto { width: 14px; height: 14px; border-radius: 50%; background: var(--light); box-shadow: 0 0 0 0 rgba(92,200,240,.7); animation: pulso 2.4s ease-in-out infinite; }
  @keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(92,200,240,.7); } 70% { box-shadow: 0 0 0 16px rgba(92,200,240,0); } 100% { box-shadow: 0 0 0 0 rgba(92,200,240,0); } }
  .tipo { font-weight: 500; font-size: 22px; letter-spacing: .3em; text-transform: uppercase; color: var(--light); }

  /* destaque */
  .destaque { display: flex; flex-direction: column; gap: 32px; height: 100%; }
  .card-agora.ao-vivo { border-color: rgba(255, 220, 110, .7); box-shadow: inset 0 1px 0 rgba(255,255,255,.32), 0 0 0 1px rgba(255, 213, 74, .6), 0 0 40px 4px rgba(255, 200, 50, .42), 0 40px 90px rgba(0, 8, 35, .45); }
  .card-agora { flex: 1; padding: 48px 72px 44px; display: flex; flex-direction: column; min-height: 0; }
  .card-agora > *, .card-seguir .info > *, .item .info > * { flex-shrink: 0; }
  .linha-topo { display: flex; align-items: center; justify-content: space-between; gap: 32px; }
  .faixa { font-weight: 300; font-size: 40px; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  .faixa b { font-weight: 700; }
  .titulo { flex: none; font-weight: 800; text-transform: uppercase; line-height: 1.02; letter-spacing: .005em; margin: 40px 0 0; text-wrap: balance; }
  .sub { font-weight: 300; font-size: 38px; line-height: 1.2; margin-top: 12px; color: rgba(244,248,252,.88); }
  .pessoas { font-weight: 600; font-size: 54px; line-height: 1.15; margin-top: 16px; color: var(--lilas); text-shadow: 0 2px 18px rgba(24, 10, 70, .35); }
  .pessoas small { font-weight: 500; font-size: 24px; letter-spacing: .3em; text-transform: uppercase; color: var(--light); margin-right: 22px; vertical-align: .35em; }
  .espaco { flex: 1; }
  .prog { display: flex; align-items: center; gap: 32px; margin-top: 20px; }
  .barra { flex: 1; height: 8px; border-radius: 8px; background: rgba(255,255,255,.14); overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; border-radius: 8px; background: linear-gradient(90deg, var(--cyan), var(--light)); transition: width 1s linear; }
  .prog .resta { font-weight: 500; font-size: 28px; letter-spacing: .08em; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .card-seguir { height: 236px; padding: 0 64px; display: flex; align-items: center; gap: 56px; flex: none; }
  .card-seguir .quando { flex: none; width: 260px; }
  .card-seguir .quando .hora { font-weight: 700; font-size: 68px; line-height: 1; font-variant-numeric: tabular-nums; }
  .card-seguir .quando .em { margin-top: 12px; font-weight: 500; font-size: 24px; letter-spacing: .14em; text-transform: uppercase; color: var(--light); }
  .card-seguir .vr { width: 1px; align-self: stretch; margin: 44px 0; background: rgba(255,255,255,.25); }
  .card-seguir .info { min-width: 0; flex: 1; }
  .card-seguir .t { font-weight: 700; font-size: 50px; line-height: 1.1; margin-top: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-seguir .p { font-weight: 600; font-size: 36px; margin-top: 10px; color: var(--lilas); text-shadow: 0 2px 14px rgba(24, 10, 70, .3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* só "a seguir" (nada acontecendo agora) */
  .contagem { display: flex; align-items: baseline; gap: 22px; margin-top: 14px; }
  .contagem .n { font-weight: 200; font-size: 150px; line-height: 1; font-variant-numeric: tabular-nums; }
  .contagem .u { font-weight: 300; font-size: 36px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }

  /* lista */
  .lista { display: flex; flex-direction: column; height: 100%; }
  .lista-topo { display: flex; justify-content: space-between; align-items: baseline; margin: -8px 0 26px; }
  .lista-topo h2 { margin: 0; font-weight: 800; font-size: 44px; letter-spacing: .26em; text-transform: uppercase; }
  .lista-topo h2 span:not(.rv-i) { font-weight: 300; }
  .pag { font-weight: 500; font-size: 26px; letter-spacing: .2em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .linhas { display: flex; flex-direction: column; gap: 18px; }
  .item { height: 146px; border-radius: 30px; padding: 0 56px; display: flex; align-items: center; gap: 48px; }
  .item .hr { flex: none; width: 200px; font-variant-numeric: tabular-nums; }
  .item .hr b { display: block; font-weight: 700; font-size: 56px; line-height: 1; }
  .item .hr > span { display: block; margin-top: 10px; font-weight: 300; font-size: 26px; color: var(--muted); letter-spacing: .06em; }
  .item .vr { width: 1px; align-self: stretch; margin: 34px 0; background: rgba(255,255,255,.25); }
  .item .info { min-width: 0; flex: 1; }
  .item .t { font-weight: 700; font-size: 44px; line-height: 1.12; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .p { font-weight: 500; font-size: 28px; margin-top: 8px; color: var(--lilas); text-shadow: 0 2px 12px rgba(24, 10, 70, .3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.pausa { background: rgba(255,255,255,.035); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
  .item.pausa .t { font-weight: 500; color: rgba(244,248,252,.82); }

  /* fim */
  .qr-tela { height: 100%; display: flex; align-items: center; gap: 96px; padding: 72px 96px; }
  .qr-txt { flex: 1; min-width: 0; }
  .qr-tela .titulo { font-size: 92px; margin-top: 22px; }
  .qr-tela .sub { max-width: 860px; margin-top: 30px; }
  .qr-tela .url { margin-top: 36px; font-weight: 600; font-size: 22px; letter-spacing: .04em; white-space: nowrap; color: var(--lilas); }
  .qr-grande { flex: none; padding: 26px; border-radius: 40px; background: #fff; box-shadow: 0 30px 80px rgba(10, 0, 40, .45), 0 0 0 10px rgba(255,255,255,.12); }
  .qr-grande img { display: block; width: 470px; height: 470px; }
  .tela .qr-grande { clip-path: inset(50% 50% 50% 50% round 40px); }
  .tela.on .qr-grande { animation: qr-abre 1.1s cubic-bezier(.16, 1, .3, 1) .75s both; }
  .tela.off .qr-grande { animation: qr-fecha .45s cubic-bezier(.7, 0, .84, 0) both; }
  @keyframes qr-abre { from { clip-path: inset(50% 50% 50% 50% round 40px); } to { clip-path: inset(0 0 0 0 round 40px); } }
  @keyframes qr-fecha { from { clip-path: inset(0 0 0 0 round 40px); } to { clip-path: inset(50% 50% 50% 50% round 40px); } }
  .fim { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .fim h2 { margin: 26px 0 0; font-weight: 800; font-size: 104px; line-height: 1.04; text-transform: uppercase; }
  .fim p { margin: 30px 0 0; font-weight: 300; font-size: 42px; color: rgba(244,248,252,.88); }
  .fim p b { font-weight: 700; color: var(--light); }

  /* rodapé: tempo até a próxima troca de tela */
  .giro { position: absolute; left: 96px; right: 96px; bottom: 48px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; z-index: 3; }
  .giro i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, rgba(92,200,240,.4), var(--light)); }
  .status { position: absolute; right: 96px; bottom: 16px; font-size: 16px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.35); z-index: 3; }

  /* vinheta */
  #vinheta { position: absolute; inset: 0; width: 1920px; height: 1080px; opacity: 0; pointer-events: none; transition: opacity .9s ease; }
  #vinheta.on { opacity: 1; transition: opacity .35s ease; }
  /* ---------- cores do Agora e do palestrante ---------- */
  .chip.agora-chip { background: linear-gradient(90deg, #BC14B0, #E824DA); border-color: rgba(255, 140, 240, .55); color: #fff; box-shadow: 0 8px 30px rgba(200, 20, 190, .45); }
  .agora-chip .ponto { background: #F283EA; animation-name: pulso-rosa; }
  @keyframes pulso-rosa { 0% { box-shadow: 0 0 0 0 rgba(242,131,234,.8); } 70% { box-shadow: 0 0 0 16px rgba(242,131,234,0); } 100% { box-shadow: 0 0 0 0 rgba(242,131,234,0); } }
  .pessoas, .card-seguir .p, .item .p { color: #FFCC00; text-transform: uppercase; letter-spacing: .05em; }
  .pessoas { font-weight: 800; }
  .card-seguir .p, .item .p { font-weight: 700; }

  /* ---------- legibilidade em telão de LED: nada abaixo de 400 ---------- */
  .rot, .marca .dia, .qr-t, .lista-topo h2 span:not(.rv-i) { font-weight: 500; }
  .relogio .d, .item .hr > span, .contagem .u, .prog .resta { font-weight: 600; }
  .sub, .faixa, .fim p, .qr-tela .sub { font-weight: 400; }
  .item.pausa .t { font-weight: 600; }
  .contagem .n { font-weight: 400; }
  .rot { color: rgba(244, 248, 252, .78); }
  .item .t span[style*="font-weight"] { font-weight: 400 !important; }
  /* ---------- fotos dos palestrantes ---------- */
  .corpo { display: flex; align-items: center; gap: 52px; }
  .textos { flex: 1; min-width: 0; }
  .fotos { flex: none; display: flex; }

let pending = 0;
for (const [src, url] of Object.entries(DATA.imgs)) {
  const im = new Image(); pending++;
  im.onload = () => { pending--; };
  im.src = url; imgs[src] = im;
}

function localMatrix(l, f) {
  const t = l.transform || {};
  let x, y;
  const defPos = l.parent ? [0, 0] : [W / 2, H / 2];
  if (t.position && !Array.isArray(t.position) && !isKf(t.position)) {
    x = evalProp(t.position.x, f, defPos[0]); y = evalProp(t.position.y, f, defPos[1]);
  } else {
    const p = evalProp(t.position, f, defPos); x = p[0]; y = p[1];
  }
  let s = evalProp(t.scale, f, 100);
  const [sx, sy] = Array.isArray(s) ? s : [s, s];
  const r = (evalProp(t.rotation, f, 0) * Math.PI) / 180;
  return new DOMMatrix().translate(x, y).rotate(0, 0, (r * 180) / Math.PI).scale(sx / 100, sy / 100);
}
function worldMatrix(l, f) {
  const m = localMatrix(l, f);
  return l.parent ? worldMatrix(byId[l.parent], f).multiply(m) : m;
}
function rectPath(ctx, l, f) {
  const [w, h] = evalProp(l.size, f, [0, 0]);
  const [ox, oy] = l.origin || [0.5, 0.5];
  ctx.rect(-ox * w, -oy * h, w, h);
}

// ---------- generative parts (same rules as the video) ----------
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const SHOTS = (() => {
  const beats = [8, 9, 10, 11, 12, 12.5, 13, 13.5, 14, 14.25, 14.5, 14.75, 15, 15.25, 15.5, 15.75];
  const pal = [C.white, C.light, C.white, C.cyan];
  const r = rng(11), out = [];
  beats.forEach((b, i) => {
    const late = i / beats.length;
    for (let c = 0; c < 2; c++) out.push({t: F(b) + c, off: (r() - 0.5) * 1700, len: 700 + r() * 900, w: 6 + r() * 4.8 + late * 4, color: pal[(i + c) % 4], dur: 16 - Math.round(late * 6), dir: c % 2 === 0 ? 1 : -1});
  });
  return out;
})();
const KICKS = []; for (let b = 16; b < 33; b++) KICKS.push(F(b));
function pulse(f, decay) { let v = 0; for (const h of KICKS) { const d = f - h; if (d >= 0 && d < decay * 8) v = Math.max(v, Math.exp(-d / decay)); } return v; }
const RINGS = [
  {t: 0, r0: 40, r1: 380, dur: 40, w: 4, c: C.light, o: 0.7}, {t: 28, r0: 40, r1: 380, dur: 40, w: 4, c: C.light, o: 0.7},
  {t: 56, r0: 40, r1: 380, dur: 40, w: 4, c: C.light, o: 0.7}, {t: 84, r0: 40, r1: 380, dur: 40, w: 4, c: C.light, o: 0.7},
  {t: 225, r0: 120, r1: 1150, dur: 30, w: 10, c: C.white, o: 0.55},
  {t: 470, r0: 40, r1: 380, dur: 40, w: 4, c: C.light, o: 0.7}, {t: 498, r0: 40, r1: 380, dur: 40, w: 4, c: C.light, o: 0.7},
];
const slant = (ctx, a, b) => { ctx.moveTo(a, 0); ctx.lineTo(b, 0); ctx.lineTo(b - H, H); ctx.lineTo(a - H, H); ctx.closePath(); };

function drawBackground(ctx, f) {
  ctx.fillStyle = C.navy; ctx.fillRect(0, 0, W, H);
  let glow = f < 225 ? 0.35 + 0.35 * prog(f, 113, 225, EZ.inQuint) : f < 470 ? 0.6 : lerp(0.6, 0.35, prog(f, 470, 516, EZ.inOutCubic));
  const g = glow * (1 + 0.22 * pulse(f, 5));
  ctx.save(); ctx.translate(960, 497); ctx.scale(1, 756 / 1152);
  const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 1152);
  grad.addColorStop(0, `rgba(0,146,203,${0.55 * g})`); grad.addColorStop(0.45, `rgba(0,88,160,${0.35 * g})`); grad.addColorStop(0.8, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad; ctx.fillRect(-1300, -1300, 2600, 2600); ctx.restore();
  // drifting "/" stripes: one full period per loop
  const shift = (f / D) * 640;
  ctx.beginPath();
  for (let i = -1; i < 6; i++) for (let j = 0; j < 4; j++) { const a = i * 640 + shift + j * 30; slant(ctx, a, a + 14); }
  ctx.fillStyle = 'rgba(255,255,255,0.045)'; ctx.fill();
}
function drawShots(ctx, f) {
  if (f < 113 || f > 240) return;
  ctx.save(); ctx.translate(960, 540); ctx.rotate(-Math.PI / 4);
  for (const s of SHOTS) {
    if (f < s.t || f > s.t + s.dur) continue;
    const p = prog(f, s.t, s.t + s.dur, EZ.outQuint);
    const x = s.dir * (-1700 + 3400 * p), len = s.len * (1 - 0.6 * p);
    ctx.fillStyle = s.color;
    for (let j = 0; j < 4; j++) ctx.fillRect(x - len / 2, s.off + j * s.w * 2, len, s.w);
  }
  ctx.restore();
}
function drawRings(ctx, f) {
  for (const e of RINGS) for (const t of [e.t, e.t - D]) {
    if (f < t || f > t + e.dur) continue;
    const p = prog(f, t, t + e.dur, EZ.outExpo), fade = 1 - prog(f, t, t + e.dur, EZ.outCubic);
    ctx.beginPath(); ctx.arc(960, 540, e.r0 + (e.r1 - e.r0) * p, 0, Math.PI * 2);
    ctx.strokeStyle = e.c; ctx.globalAlpha = e.o * fade; ctx.lineWidth = e.w * (1 - 0.5 * p); ctx.stroke(); ctx.globalAlpha = 1;
  }
}
function drawWipe(ctx, f) {
  const c = 225, cols = [C.cyan, C.white, '#C415B7'], n = 3, L0 = -40, L1 = W + H + 40;
  if (f < c - 12 || f > c + 14) return;
  cols.forEach((col, j) => {
    const Lp = L0 + (L1 - L0) * prog(f, c - 12 + j * 2, c, EZ.inOutQuint);
    const Tp = L0 + (L1 - L0) * prog(f, c + (n - 1 - j) * 2, c + 14, EZ.inOutQuint);
    if (Lp - Tp < 0.5) return;
    ctx.beginPath(); slant(ctx, Tp, Lp); ctx.fillStyle = col; ctx.fill();
  });
}
function drawFlash(ctx, f) {
  if (f < 225 || f >= 234) return;
  const o = 0.35 * (1 - prog(f, 225, 234, EZ.outCubic));
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = o; ctx.fillStyle = C.cyan; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function drawLogo(ctx, f) {
  for (const l of layers) {
    if (l.type !== 'image' || matteIds.has(l.id)) continue;
    const a = l.in ?? 0, b = l.out ?? D;
    if (f < a || f >= b) continue;
    const op = evalProp((l.transform || {}).opacity, f, 100) / 100;
    if (op <= 0.001) continue;
    ctx.save();
    if (l.matte) {
      const m = byId[l.matte.layer];
      ctx.setTransform(worldMatrix(m, f)); ctx.beginPath(); rectPath(ctx, m, f); ctx.clip();
    }
    ctx.setTransform(worldMatrix(l, f));
    ctx.globalAlpha = op;
    const im = imgs[l.src];
    ctx.drawImage(im, -l.width / 2, -l.height / 2, l.width, l.height);
    ctx.restore();
  }
}

function paraMin(s) {
  const m = String(s || '').trim().match(/^(\d{1,2})\s*[:hH]\s*(\d{2})?/);
  return m ? Number(m[1]) * 60 + Number(m[2] || 0) : null;
}
function paraData(s) {
  s = String(s || '').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return [+m[1], +m[2], +m[3]];
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) {
    let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000;
    return b > 12 ? [y, a, b] : [y, b, a]; // padrão dd/mm; troca se só fizer sentido como mm/dd
  }
  return null;
}
const chave = ([y, m, d]) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
const sem = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase();

function lerCSV(txt) {
  const rows = []; let row = [], cel = '', q = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) { if (c === '"') { if (txt[i + 1] === '"') { cel += '"'; i++; } else q = false; } else cel += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cel); cel = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && txt[i + 1] === '\n') i++; row.push(cel); rows.push(row); row = []; cel = ''; }
    else cel += c;
  }
  if (cel !== '' || row.length) { row.push(cel); rows.push(row); }
  return rows;
}
// links do Google Drive viram endereço de imagem (o arquivo precisa estar público)
function linkFoto(u) {
  if (!/drive\.google|docs\.google/.test(u)) return u;
  const m = u.match(/\/d\/([\w-]{20,})/) || u.match(/[?&]id=([\w-]{20,})/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1000` : u;
}
function montar(rows) {
  const cab = rows[0].map(sem);
  const col = (n) => cab.indexOf(n);
  const iFoto = cab.findIndex((c) => c.includes('foto'));
  const out = [];
  for (const r of rows.slice(1)) {
    const v = (n) => { const i = col(n); return i < 0 ? '' : String(r[i] ?? '').trim(); };
    const data = paraData(v('data')), ini = paraMin(v('inicio'));
    if (!data || ini === null || !v('titulo')) continue;
    if (sem(v('publicar')).startsWith('n')) continue;
    const [y, m, d] = data;
    const fimMin = paraMin(v('fim'));
    const inicio = new Date(y, m - 1, d, 0, ini);
    const fim = fimMin !== null && fimMin > ini ? new Date(y, m - 1, d, 0, fimMin) : null;
    out.push({
      id: v('id'), dia: chave(data), inicio, fim, fimEf: fim || new Date(inicio.getTime() + CONFIG.semFimDuracaoMin * 60000),
      tipo: sem(v('tipo')), titulo: v('titulo'), subtitulo: v('subtitulo'),
      pessoas: v('palestrantes').split(';').map((s) => s.trim()).filter(Boolean),
      org: v('organizacao'), local: v('local'),
      fotos: (iFoto < 0 ? '' : String(r[iFoto] ?? '')).split(/[;\n]/).map((s) => s.trim()).filter((s) => /^(https?|file):\/\//.test(s)).map(linkFoto),
    });
  }
  return out.sort((a, b) => a.inicio - b.inicio || a.id.localeCompare(b.id));
}

let ITENS = montar(RESERVA);
let fonte = 'reserva', ultimaCarga = null;
try { const c = JSON.parse(localStorage.getItem('prog-cache') || 'null'); if (c) { ITENS = montar(c.rows); fonte = 'cache'; ultimaCarga = new Date(c.t); } } catch (e) {}

async function carregar() {
  const id = Q.get('planilha') || CONFIG.planilhaId;
  const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(CONFIG.aba)}&_=${Date.now()}`;
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const rows = lerCSV(await r.text());
    const itens = montar(rows);
    if (!itens.length) throw new Error('planilha vazia ou colunas não reconhecidas');
    ITENS = itens; fonte = 'planilha'; ultimaCarga = new Date();
    try { localStorage.setItem('prog-cache', JSON.stringify({ t: Date.now(), rows })); } catch (e) {}
  } catch (e) {
    console.warn('Planilha não carregou:', e);
  }
  marcarStatus();
}
function marcarStatus() {
  const el = document.getElementById('status');
  if (fonte === 'planilha') el.textContent = '';
  else if (fonte === 'cache') el.textContent = `sem conexão · dados de ${hhmm(ultimaCarga)}`;
  else el.textContent = 'sem conexão com a planilha';
}

// atividades encerradas antes da hora pelo operador (controle.html ou tecla F)
const lerFinalizados = () => { try { return JSON.parse(localStorage.getItem('prog-finalizados') || '{}'); } catch (e) { return {}; } };
let FINALIZADOS = lerFinalizados();
const chaveDe = (i) => i.id || `${i.dia}|${i.inicio.getTime()}|${i.titulo}`;
const DIAS_SEMANA = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const hhmm = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
const ddmm = (k) => `${k.slice(8, 10)}/${k.slice(5, 7)}`;
const semana = (k) => { const [y, m, d] = k.split('-').map(Number); return DIAS_SEMANA[new Date(y, m - 1, d).getDay()]; };

function estado() {
  const now = agora();
  const dias = [...new Set(ITENS.map((i) => i.dia))].sort();
  const hoje = chave([now.getFullYear(), now.getMonth() + 1, now.getDate()]);
  let dia = null;
  const fx = Q.get('dia');
  if (fx) dia = /^\d+$/.test(fx) ? dias[Number(fx) - 1] : fx;
  else dia = dias.includes(hoje) ? hoje : dias.find((d) => d > hoje) || null;
  const doDia = ITENS.filter((i) => i.dia === dia && !FINALIZADOS[chaveDe(i)]);
  const vivos = doDia.filter((i) => i.fimEf > now);
  const atual = vivos.find((i) => i.inicio <= now) || null;
  const futuros = vivos.filter((i) => i.inicio > now);
  const proximo = futuros[0] || null;
  const resto = futuros.slice(1);
  const listas = [];
  for (let i = 0; i < resto.length; i += CONFIG.itensPorLista) listas.push(resto.slice(i, i + CONFIG.itensPorLista));
  const proxDia = dias.find((d) => d > (dia || hoje));
  const primeiroProx = proxDia ? ITENS.find((i) => i.dia === proxDia) : null;
  return { now, dia, numDia: dias.indexOf(dia) + 1, atual, proximo, listas, primeiroProx };
}

function emQuanto(ms) {
  const m = Math.ceil(ms / 60000);
  if (m <= 1) return 'começando';
  if (m < 60) return `em ${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `em ${h}h${String(r).padStart(2, '0')}` : `em ${h}h`;
}
function falta(ms) {
  const m = Math.ceil(ms / 60000);
  if (m < 60) return `faltam ${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return `faltam ${h}h${String(r).padStart(2, '0')}`;
}

// encolhe o título até caber no número de linhas
function ajustar(root) {
  // título principal: diminui até caber em N linhas e dentro do cartão
  root.querySelectorAll('[data-fit]').forEach((el) => {
    const linhas = Number(el.dataset.fit), card = el.closest('.glass');
    const estoura = () => {
      if (!card) return false;
      const fundo = card.getBoundingClientRect().bottom - parseFloat(getComputedStyle(card).paddingBottom) * (card.getBoundingClientRect().height / card.offsetHeight);
      return card.lastElementChild.getBoundingClientRect().bottom > fundo + 1;
    };
    const passa = (px) => el.offsetHeight > linhas * px * 1.02 + 6 || estoura();
    let px = 112;
    el.style.fontSize = px + 'px';
    while (px > 48 && passa(px)) { px -= 2; el.style.fontSize = px + 'px'; }
  });
  // linhas únicas (a seguir, listas): diminui até 72% antes de recorrer às reticências
  root.querySelectorAll('.card-seguir .t, .item .t, .card-seguir .p, .item .p').forEach((el) => {
    const base = parseFloat(getComputedStyle(el).fontSize);
    let px = base;
    while (px > base * 0.72 && el.scrollWidth > el.clientWidth + 1) { px -= 1; el.style.fontSize = px + 'px'; }
  });
}

// textos que sobem por máscara e elementos que abrem da esquerda
const SOBE = '.tipo, .titulo, .sub, .pessoas, .faixa, .resta, .hora, .em, .rot, .t, .p, .hr b, .hr span, .lista-topo h2, .pag, .fim h2, .fim p';
const ABRE = '.chip, .barra, .contagem';
function coreografar(root) {
  const passos = [];
  const fora = [...root.querySelectorAll(SOBE + ', ' + ABRE + ', .foto')].filter((el) => !el.closest('.glass'));
  let tempo = 0;
  fora.forEach((el) => passos.push([el, (tempo += 110) - 110]));
  root.querySelectorAll('.glass').forEach((card, ci) => {
    const d0 = 160 + ci * 150;
    card.style.setProperty('--d', d0 + 'ms');
    [...card.querySelectorAll(SOBE + ', ' + ABRE + ', .foto')].forEach((el, k) => passos.push([el, d0 + 480 + k * 75]));
  });
  for (const [el, d] of passos) {
    if (el.matches('.foto')) { el.style.setProperty('--d', d + 'ms'); continue; }
    if (el.matches(ABRE)) { el.classList.add('pop'); el.style.setProperty('--d', d + 'ms'); continue; }
    if (el.matches('.titulo')) {
      const palavras = el.textContent.trim().split(/\s+/);
      el.innerHTML = palavras.map((w, i) => `<span class="w"><span class="wi" style="--d:${d + i * 60}ms">${esc(w)}</span></span>`).join(' ');
      continue;
    }
    el.classList.add('rv');
    el.innerHTML = `<span class="rv-i" style="--d:${d}ms">${el.innerHTML}</span>`;
  }
}

function vivos() {
  const now = agora().getTime();
  document.getElementById('hora').textContent = hhmm(agora());
  document.querySelectorAll('[data-ini]').forEach((el) => {
    const a = +el.dataset.ini, b = +el.dataset.fim;
    el.style.width = Math.max(0, Math.min(100, ((now - a) / (b - a)) * 100)) + '%';
  });
  document.querySelectorAll('[data-falta]').forEach((el) => { (el.querySelector('.rv-i') || el).textContent = falta(+el.dataset.falta - now); });
  document.querySelectorAll('[data-em]').forEach((el) => { (el.querySelector('.rv-i') || el).textContent = emQuanto(+el.dataset.em - now); });
  document.querySelectorAll('[data-contagem]').forEach((el) => {
    const m = Math.max(0, Math.ceil((+el.dataset.contagem - now) / 60000));
    if (m <= 1) el.innerHTML = '<span class="u">começando agora</span>';
    else if (m < 60) el.innerHTML = `<span class="n">${m}</span><span class="u">min para começar</span>`;
    else el.innerHTML = `<span class="u">começa às</span><span class="n">${hhmm(new Date(+el.dataset.contagem))}</span>`;
  });
}

const stage = document.getElementById('stage');
let introAtiva = null, introTimer = null, vinhetaRodando = false, vinhetaToken = 0;
let telaAtual = null, fase = 'destaque', idxLista = 0, ultimaVinheta = -Infinity, timer = null;

function mostrar(html, segundos) {
  const nova = document.createElement('section');
  nova.className = 'tela';
  nova.innerHTML = html;
  stage.insertBefore(nova, document.querySelector('.giro'));
  ajustar(nova);
  vivos();
  coreografar(nova);
  const velha = telaAtual;
  telaAtual = nova;
  if (velha) { velha.classList.add('off'); setTimeout(() => velha.remove(), 1400); }
  setTimeout(() => nova.classList.add('on'), velha ? 900 : 30);
  const g = document.getElementById('giro');
  g.style.transition = 'none'; g.style.width = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => { g.style.transition = `width ${segundos}s linear`; g.style.width = '100%'; }));
  clearTimeout(timer);
  timer = setTimeout(passo, segundos * 1000);
}

function cabecalho(s) {
  document.getElementById('dia').innerHTML = s.dia ? `<b>Dia ${s.numDia}</b>Programação` : '<b>Programação</b>';
  const now = s.now;
  document.getElementById('data').textContent = `${DIAS_SEMANA[now.getDay()]} · ${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}`;
}

function passo() {
  if (introAtiva) return;
  const s = estado();
  cabecalho(s);
  if (!s.atual && !s.proximo) { fase = 'destaque'; idxLista = 0; return mostrar(telaFim(s), 30); }

  // fim de ciclo: tela do QR code e depois a vinheta da logo
  if (fase === 'qr') {
    fase = 'vinheta';
    return mostrar(telaQR(), CONFIG.tempoQrSeg);
  }
  if (fase === 'vinheta') {
    fase = 'destaque';
    if (Q.get('vinheta') !== '0' && performance.now() - ultimaVinheta > CONFIG.vinhetaCadaMin * 60000) return tocarVinheta(passo);
  }
  if (fase === 'destaque' || !s.listas.length) {
    fase = s.listas.length ? 'lista' : 'qr';
    return mostrar(telaDestaque(s), CONFIG.tempoDestaqueSeg);
  }
  if (idxLista >= s.listas.length) idxLista = 0;
  const n = idxLista++;
  if (idxLista >= s.listas.length) { idxLista = 0; fase = 'qr'; } else fase = 'destaque';
  mostrar(telaLista(s, n), CONFIG.tempoListaSeg);
}

const vcan = document.getElementById('vinheta'), vctx = vcan.getContext('2d');
vctx.imageSmoothingQuality = 'high';

function tocarVinheta(depois) {
  ultimaVinheta = performance.now();
  vinhetaRodando = true;
  const meu = ++vinhetaToken;
  clearTimeout(timer);
  const anterior = telaAtual; telaAtual = null;
  if (anterior) setTimeout(() => anterior.remove(), 400);
  const a = CONFIG.vinhetaInicio, b = CONFIG.vinhetaFim;
  let t0 = null;
  vcan.classList.add('on'); document.body.classList.add('vinheta-on');
  const g = document.getElementById('giro'); g.style.transition = 'none'; g.style.width = '0';
  function quadro(now) {
    if (meu !== vinhetaToken) return; // outra vinheta (ou a intro) assumiu
    if (t0 === null) t0 = now;
    const f = a + ((now - t0) / 1000) * FPS;
    if (f >= b) {
      vcan.classList.remove('on'); document.body.classList.remove('vinheta-on');
      vinhetaRodando = false;
      depois();
      return;
    }
    vctx.setTransform(1, 0, 0, 1, 0, 0);
    vctx.clearRect(0, 0, W, H); drawShots(vctx, f); drawRings(vctx, f); drawWipe(vctx, f); drawLogo(vctx, f); drawFlash(vctx, f);
    requestAnimationFrame(quadro);
  }
  requestAnimationFrame(quadro);
}

function logoEstatica() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
  drawLogo(x, CONFIG.vinhetaFim - 1);
  const px = x.getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let y = 0; y < H; y += 2) for (let xx = 0; xx < W; xx += 2) {
    if (px[(y * W + xx) * 4 + 3] > 8) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  const pad = 6, w = x1 - x0 + pad * 2, h = y1 - y0 + pad * 2;
  const o = document.createElement('canvas'); o.width = w; o.height = h;
  o.getContext('2d').drawImage(c, x0 - pad, y0 - pad, w, h, 0, 0, w, h);
  document.getElementById('logo').src = o.toDataURL('image/png');
}

// TRILHA DA INTRO
// Usa o arquivo musica-intro.mp3 (na mesma pasta da página) se existir;
// senão toca uma trilha gerada aqui mesmo.
// =====================================================================
const Trilha = (() => {
  const ARQUIVO = 'musica-intro.mp3';
  let vivo = null, fontes = [], mestre = null, fade = null, arquivoOk = null, aoBloquear = () => {};
  const audio = new Audio();
  audio.preload = 'auto';
  audio.addEventListener('canplaythrough', () => { arquivoOk = true; }, { once: true });
  audio.addEventListener('error', () => { arquivoOk = false; }, { once: true });
  audio.src = ARQUIVO;

  const freq = (n) => 440 * Math.pow(2, (n - 69) / 12);

  function gerar(seg, vol, offline) {
    const ctx = offline || (vivo = vivo || new (window.AudioContext || window.webkitAudioContext)());
    if (!offline) ctx.resume();
    const t = ctx.currentTime + 0.05, fim = t + seg;
    mestre = ctx.createGain();
    mestre.gain.setValueAtTime(0.0001, t);
    mestre.gain.exponentialRampToValueAtTime(vol, t + 1.2);
    mestre.gain.setValueAtTime(vol, fim - 3);
    mestre.gain.linearRampToValueAtTime(0, fim);
    const comp = ctx.createDynamicsCompressor();
    mestre.connect(comp).connect(ctx.destination);
    // eco para dar ambiência
    const eco = ctx.createDelay(); eco.delayTime.value = 0.375;
    const volta = ctx.createGain(); volta.gain.value = 0.38;
    const molhado = ctx.createGain(); molhado.gain.value = 0.45;
    eco.connect(volta).connect(eco); eco.connect(molhado).connect(mestre);
    const osc = (tipo, f, ini, fimO, destino) => {
      const o = ctx.createOscillator(); o.type = tipo; o.frequency.value = f;
      o.connect(destino); o.start(ini); o.stop(fimO); fontes.push(o); return o;
    };
    // colchão de acordes (Ré maior com nona) abrindo o filtro
    const filtro = ctx.createBiquadFilter(); filtro.type = 'lowpass'; filtro.Q.value = 0.8;
    filtro.frequency.setValueAtTime(220, t);
    filtro.frequency.exponentialRampToValueAtTime(2600, t + 5);
    filtro.frequency.exponentialRampToValueAtTime(700, fim);
    const pad = ctx.createGain(); pad.gain.value = 0.05;
    filtro.connect(pad).connect(mestre); pad.connect(eco);
    for (const n of [38, 45, 50, 54, 57, 64]) for (const d of [-8, 8]) osc('sawtooth', freq(n), t, fim + 0.1, filtro).detune.value = d;
    // subida de ruído até a entrada do título
    const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), dd = buf.getChannelData(0);
    for (let i = 0; i < dd.length; i++) dd[i] = Math.random() * 2 - 1;
    const ruido = ctx.createBufferSource(); ruido.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.5;
    bp.frequency.setValueAtTime(300, t); bp.frequency.exponentialRampToValueAtTime(7000, t + 1.35);
    const rg = ctx.createGain();
    rg.gain.setValueAtTime(0.0001, t); rg.gain.exponentialRampToValueAtTime(0.22, t + 1.3); rg.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
    ruido.connect(bp).connect(rg).connect(mestre); ruido.start(t); ruido.stop(t + 1.8); fontes.push(ruido);
    // impacto
    const hit = t + 1.4;
    const kg = ctx.createGain(); kg.gain.setValueAtTime(0.0001, t); kg.gain.setValueAtTime(0.9, hit); kg.gain.exponentialRampToValueAtTime(0.0001, hit + 1.8);
    kg.connect(mestre);
    const k = osc('sine', 110, t, hit + 2, kg); k.frequency.setValueAtTime(110, hit); k.frequency.exponentialRampToValueAtTime(36, hit + 0.7);
    // pulso grave e arpejo de sinos
    const arp = [74, 78, 81, 88, 81, 78, 76, 81];
    for (let x = hit + 0.5, j = 0; x < fim - 2.2; x += 0.25, j++) {
      if (j % 2 === 0) {
        const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, x); g.gain.exponentialRampToValueAtTime(0.22, x + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, x + 0.4);
        g.connect(mestre); osc('sine', freq(38), x, x + 0.45, g);
      }
      const g2 = ctx.createGain(); g2.gain.setValueAtTime(0.0001, x); g2.gain.exponentialRampToValueAtTime(0.05, x + 0.01); g2.gain.exponentialRampToValueAtTime(0.0001, x + 0.6);
      g2.connect(mestre); g2.connect(eco); osc('triangle', freq(arp[j % arp.length]), x, x + 0.65, g2);
    }
  }

  function tocar(seg, vol = 0.8) {
    parar(true);
    // tenta o arquivo mesmo se ainda não carregou (alguns navegadores só carregam ao tocar)
    if (arquivoOk !== false) {
      audio.muted = false; audio.currentTime = 0; audio.volume = vol;
      audio.play().then(() => {
        const t0 = Date.now();
        fade = setInterval(() => {
          const s = (Date.now() - t0) / 1000, falta = seg - s;
          if (falta <= 0) { audio.pause(); clearInterval(fade); fade = null; }
          else if (falta < 3) audio.volume = vol * (falta / 3);
        }, 100);
      }).catch((e) => {
        if (e && e.name === 'NotAllowedError') aoBloquear();
        else { arquivoOk = false; gerar(seg, vol); }
      });
    } else {
      gerar(seg, vol);
      if (vivo && vivo.state !== 'running') setTimeout(() => { if (vivo.state !== 'running') aoBloquear(); }, 300);
    }
  }

  // chamado dentro de um clique/tecla: libera o áudio para tocar depois sem gesto
  function desbloquear() {
    try { vivo = vivo || new (window.AudioContext || window.webkitAudioContext)(); vivo.resume(); } catch (e) {}
    audio.muted = true;
    return audio.play().then(() => { audio.pause(); audio.currentTime = 0; audio.muted = false; return true; })
      .catch((e) => { audio.muted = false; return !(e && e.name === 'NotAllowedError') && vivo && vivo.state === 'running'; });
  }

  function parar(ja) {
    clearInterval(fade); fade = null;
    if (!audio.paused) {
      if (ja) audio.pause();
      else { const v0 = audio.volume; let k = 1; fade = setInterval(() => { k -= 0.1; if (k <= 0) { audio.pause(); clearInterval(fade); fade = null; } else audio.volume = v0 * k; }, 50); }
    }
    if (mestre && vivo) {
      const t = vivo.currentTime;
      mestre.gain.cancelScheduledValues(t); mestre.gain.setValueAtTime(mestre.gain.value, t); mestre.gain.linearRampToValueAtTime(0, t + (ja ? 0.05 : 0.6));
      const lista = fontes; setTimeout(() => lista.forEach((o) => { try { o.stop(); } catch (e) {} }), ja ? 100 : 700);
    }
    fontes = []; mestre = null;
  }

  return { tocar, parar, gerar, desbloquear, aoBloquear: (f) => { aoBloquear = f; }, get fonte() { return arquivoOk ? 'arquivo' : arquivoOk === false ? 'gerada' : 'carregando'; }, ARQUIVO };
})();

// =====================================================================
// LIGAÇÃO ENTRE A TV E O CONTROLE
// No mesmo computador: BroadcastChannel (direto, sem internet).
// De outro aparelho (celular): ntfy.sh, num canal privado passado na URL
// como ?canal=CÓDIGO (fica guardado no navegador depois da primeira vez).
// =====================================================================
const Elo = (() => {
  const eu = Math.random().toString(36).slice(2, 10);
  let codigo = Q.get('canal');
  try { if (codigo) localStorage.setItem('prog-canal', codigo); else codigo = localStorage.getItem('prog-canal'); } catch (e) {}
  const base = codigo ? (Q.get('servidor') || 'https://ntfy.sh') + '/' + encodeURIComponent(codigo) : null;
  const bc = 'BroadcastChannel' in window ? new BroadcastChannel('prog-controle') : null;
  const vistos = new Set();
  let ouvinte = () => {}, conectado = false, aoMudar = () => {};

  function receber(m, via) {
    if (!m || typeof m !== 'object' || m.de === eu || vistos.has(m.id)) return;
    vistos.add(m.id);
    ouvinte(m, via);
  }
  if (bc) bc.onmessage = (e) => receber(e.data, 'local');

  if (base) {
    const es = new EventSource(base + '/sse');
    es.addEventListener('open', () => { conectado = true; aoMudar(); });
    es.onopen = () => { conectado = true; aoMudar(); };
    es.onerror = () => { conectado = false; aoMudar(); };
    es.onmessage = (e) => {
      try { const d = JSON.parse(e.data); if (d.event === 'message') receber(JSON.parse(d.message), 'rede'); } catch (x) {}
    };
  }

  // soLocal: só para quem está no mesmo computador (não gasta mensagens da rede)
  function enviar(m, soLocal) {
    m = { ...m, de: eu, id: eu + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) };
    vistos.add(m.id);
    bc?.postMessage(m);
    if (base && !soLocal) fetch(base, { method: 'POST', body: JSON.stringify(m) }).catch(() => {});
  }

  // últimas mensagens do canal (o ntfy guarda por algumas horas)
  async function recentes(seg) {
    if (!base) return [];
    try {
      const r = await fetch(`${base}/json?poll=1&since=${Math.round(seg)}s`);
      return (await r.text()).split('\n').filter(Boolean).map((l) => {
        try { const d = JSON.parse(l); return d.event === 'message' ? JSON.parse(d.message) : null; } catch (e) { return null; }
      }).filter(Boolean);
    } catch (e) { return []; }
  }

  return {
    enviar, recentes,
    ao: (f) => { ouvinte = f; },
    aoMudarConexao: (f) => { aoMudar = f; },
    get remoto() { return !!base; },
    get conectado() { return conectado; },
    codigo,
  };
})();

function htmlIntro(i) {
  const n = Math.min(i.fotos.length, 3);
  const fotos = n ? `<div class="in-fotos n${n}">${i.fotos.slice(0, 3).map((u) => `<div class="foto"><img src="${esc(u)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></div>`).join('')}</div>` : '';
  const chip = i.inicio <= agora() ? '<span class="chip vivo agora-chip"><span class="ponto"></span>Agora</span>' : '<span class="chip vivo agora-chip"><span class="ponto"></span>A seguir</span>';
  return `<img class="in-logo" src="${document.getElementById('logo').src}" alt="">
    <div class="in-luz"></div>
    <div class="in-grupo ${n ? '' : 'sem-foto'}" style="--dur:${CONFIG.introSeg}s">${fotos}<div class="in-txt">
      ${chip}
      ${rotulo(i) ? `<div class="tipo">${esc(rotulo(i))}</div>` : ''}
      <h1 class="titulo">${esc(i.titulo)}</h1>
      ${i.subtitulo ? `<div class="sub">${esc(i.subtitulo)}</div>` : ''}
      <div class="in-linha"></div>
      ${quem(i) ? `<div class="pessoas"><small>com</small>${quem(i)}</div>` : ''}
      <div class="faixa">${faixa(i)}</div>
    </div></div>`;
}

const vinhetaSeg = () => (CONFIG.vinhetaFim - CONFIG.vinhetaInicio) / FPS;

// intro: abre com a vinheta da logo da convenção e depois mostra o cartão da atividade
function pedirIntro(chave, vol) {
  const it = ITENS.find((i) => chaveDe(i) === chave);
  if (!it) return;
  clearTimeout(timer); clearTimeout(introTimer);
  document.getElementById('intro').innerHTML = '';
  document.body.classList.remove('intro-on');
  introAtiva = chave;
  Trilha.tocar(vinhetaSeg() + CONFIG.introSeg, vol ?? CONFIG.introVolume);
  enviarEstado();
  tocarVinheta(() => { if (introAtiva === chave) cartaoIntro(it); });
}

function cartaoIntro(it) {
  const box = document.getElementById('intro');
  const sec = document.createElement('section');
  sec.className = 'tela intro';
  sec.innerHTML = htmlIntro(it);
  box.appendChild(sec);
  document.body.classList.add('intro-on');
  // título: o maior tamanho que caiba em 3 linhas
  const t = sec.querySelector('.titulo'), txt = sec.querySelector('.in-txt');
  let px = it.fotos.length ? 120 : 140;
  t.style.fontSize = px + 'px';
  while (px > 56 && (t.offsetHeight > 3 * px * 1.06 + 4 || txt.offsetHeight > 860)) { px -= 2; t.style.fontSize = px + 'px'; }
  coreografar(sec);
  const lin = sec.querySelector('.in-linha'), pes = sec.querySelector('.pessoas .rv-i');
  if (lin) lin.style.setProperty('--d', (pes ? parseInt(pes.style.getPropertyValue('--d')) - 150 : 1200) + 'ms');
  const g = document.getElementById('giro'); g.style.transition = 'none'; g.style.width = '0';
  setTimeout(() => sec.classList.add('on'), 150);
  introTimer = setTimeout(fecharIntro, CONFIG.introSeg * 1000);
}

function fecharIntro() {
  clearTimeout(introTimer);
  const sec = document.querySelector('#intro .tela');
  if (sec) sec.classList.add('off');
  setTimeout(() => {
    document.getElementById('intro').innerHTML = '';
    document.body.classList.remove('intro-on');
    introAtiva = null;
    enviarEstado();
    fase = 'destaque'; idxLista = 0;
    passo();
  }, 900);
}

function pararIntro() {
  Trilha.parar();
  if (!introAtiva) return;
  if (vinhetaRodando) {
    vinhetaToken++; vinhetaRodando = false;
    vcan.classList.remove('on'); document.body.classList.remove('vinheta-on');
    introAtiva = null;
    enviarEstado();
    fase = 'destaque'; idxLista = 0;
    return passo();
  }
  fecharIntro();
}

// a programação mudou (atividade finalizada ou desfeita): volta para o destaque na hora
function reiniciarCiclo() {
  if (introAtiva || vinhetaRodando || !telaAtual) return;
  fase = 'destaque'; idxLista = 0;
  passo();
}

function salvarFinalizados() {
  try { localStorage.setItem('prog-finalizados', JSON.stringify(FINALIZADOS)); } catch (e) {}
  enviarEstado();
}

// som: o navegador só deixa a TV tocar áudio depois de um clique ou tecla nesta aba
let somLiberado = false;
const aviso = document.getElementById('som-aviso');
function liberarSom() {
  if (somLiberado) return;
  Trilha.desbloquear().then((ok) => {
    if (!ok || somLiberado) return;
    somLiberado = true;
    aviso.hidden = true;
    enviarEstado();
  });
}
addEventListener('pointerdown', liberarSom);
addEventListener('keydown', liberarSom);
// se o navegador barrar o som numa intro, avisa na TV e no controle
Trilha.aoBloquear(() => { somLiberado = false; aviso.hidden = false; enviarEstado(); });

// a TV é quem guarda o estado; o controle só manda comandos e mostra o que ela responde
function enviarEstado(soLocal) {
  Elo.enviar({ tipo: 'estado', finalizados: FINALIZADOS, intro: introAtiva, introSeg: vinhetaSeg() + CONFIG.introSeg, som: somLiberado, musica: Trilha.fonte }, soLocal);
}
Elo.ao((m, via) => {
  if (m.tipo === 'ping') return enviarEstado(via === 'local');
  if (m.tipo === 'intro') pedirIntro(m.chave, m.vol);
  else if (m.tipo === 'parar-intro') { const tinha = introAtiva; pararIntro(); if (!tinha) enviarEstado(); }
  else if (m.tipo === 'finalizar') { FINALIZADOS[m.chave] = Date.now(); salvarFinalizados(); reiniciarCiclo(); }
  else if (m.tipo === 'desfazer') { delete FINALIZADOS[m.chave]; salvarFinalizados(); reiniciarCiclo(); }
  else if (m.tipo === 'testar-som') { if (!introAtiva) Trilha.tocar(6, m.vol ?? CONFIG.introVolume); }
});

// atalhos no próprio computador da TV
//   I = intro da próxima atividade · F = finalizar a atividade atual
//   Z = desfazer a última finalização · Esc = parar a intro
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase(), s = estado();
  if (k === 'i') { const alvo = s.proximo || s.atual; if (alvo) pedirIntro(chaveDe(alvo)); }
  else if (k === 'f' && s.atual) { FINALIZADOS[chaveDe(s.atual)] = Date.now(); salvarFinalizados(); reiniciarCiclo(); }
  else if (k === 'z') {
    const ult = Object.entries(FINALIZADOS).sort((a, b) => b[1] - a[1])[0];
    if (ult) { delete FINALIZADOS[ult[0]]; salvarFinalizados(); reiniciarCiclo(); }
  }
  else if (k === 'escape') pararIntro();
});

// =====================================================================
// INÍCIO
// =====================================================================
function escalar() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = document.getElementById('intro').style.transform = `scale(${k}) translate(-50%, -50%)`;
  // fundo e vinheta preenchem a tela inteira, qualquer que seja a proporção
  const c = Math.max(innerWidth / 1920, innerHeight / 1080);
  document.querySelectorAll('.cobre').forEach((el) => { el.style.transform = `scale(${c}) translate(-50%, -50%)`; });
}
addEventListener('resize', escalar); escalar();

if (Q.get('qr') === '0') document.getElementById('qr').remove();
(function iniciar() {
  if (pending) return setTimeout(iniciar, 50);
  logoEstatica();
  marcarStatus();
  setInterval(vivos, 1000);
  setInterval(carregar, CONFIG.atualizarCadaSeg * 1000);
  const comecar = () => (Q.get('vinheta') === '0') ? (document.body.classList.remove('vinheta-on'), passo()) : tocarVinheta(passo);
  Promise.race([carregar(), new Promise((r) => setTimeout(r, 4000))]).then(() => document.fonts.ready).then(comecar);
  enviarEstado();
})();
</script>
